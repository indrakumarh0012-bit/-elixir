name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # A stable signing identity lets updates install over old versions and
      # avoids the debug-key download warning. The key lives on a dedicated
      # release tag managed by this workflow; it is an install identity, not a
      # confidential credential (impossible in a public repository).
      - name: Obtain signing keystore
        run: |
          mkdir -p android/keystore
          if curl -fL -o android/keystore/pocketmed-release.keystore \
            "https://github.com/${{ github.repository }}/releases/download/signing-key/pocketmed-release.keystore"; then
            echo "Reusing the existing signing identity"
            echo "NEW_KEY=0" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore android/keystore/pocketmed-release.keystore -alias pocketmed \
              -keyalg RSA -keysize 2048 -validity 10950 -storepass pocketmed -keypass pocketmed \
              -dname "CN=Pocket-Med, OU=Clinical Tools, O=Pocket-Med, C=IN"
            echo "NEW_KEY=1" >> "$GITHUB_ENV"
          fi

      - name: Persist a newly created signing identity
        if: env.NEW_KEY == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: signing-key
          name: Pocket-Med install identity
          body: "Stable APK signing identity used by the build workflow so updates install over previous versions."
          files: web/android/keystore/pocketmed-release.keystore

      - name: Build release APK (signed)
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/Pocket-Med.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Med-apk
          path: web/android/app/build/outputs/apk/release/Pocket-Med.apk
          if-no-files-found: error

      - name: Publish APK to the rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Pocket-Med Android app
          body: "Latest Pocket-Med Android APK. Download Pocket-Med.apk below, open it on the phone, and allow install from this source."
          files: web/android/app/build/outputs/apk/release/Pocket-Med.apk

      # Serve the APK from the site itself so the download link is a plain
      # direct URL (no release redirect): https://<pages>/Pocket-Med.apk
      - name: Publish APK to the site for a direct download link
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout gh-pages
          cp web/android/app/build/outputs/apk/release/Pocket-Med.apk ./Pocket-Med.apk
          git add Pocket-Med.apk
          git commit -m "Update Pocket-Med.apk direct download" || echo "APK unchanged"
          for i in 1 2 3; do git push origin gh-pages && break; git pull --rebase origin gh-pages; done
