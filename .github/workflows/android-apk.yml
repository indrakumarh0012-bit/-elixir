name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Pocket-Med.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Med-apk
          path: web/android/app/build/outputs/apk/debug/Pocket-Med.apk
          if-no-files-found: error

      - name: Publish APK to the rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Pocket-Med Android app
          body: "Latest Pocket-Med Android APK. Download Pocket-Med.apk below, open it on the phone, and allow install from this source."
          files: web/android/app/build/outputs/apk/debug/Pocket-Med.apk

      # Serve the APK from the site itself so the download link is a plain
      # direct URL (no release redirect): https://<pages>/Pocket-Med.apk
      - name: Publish APK to the site for a direct download link
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout gh-pages
          cp web/android/app/build/outputs/apk/debug/Pocket-Med.apk ./Pocket-Med.apk
          git add Pocket-Med.apk
          git commit -m "Update Pocket-Med.apk direct download" || echo "APK unchanged"
          for i in 1 2 3; do git push origin gh-pages && break; git pull --rebase origin gh-pages; done
