name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
      release_name:
        description: "Release title"
        required: false
        default: "Smart-Elixir Android"

jobs:
  release-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.release_name }} ${{ github.event.inputs.tag }}
          body: |
            ## Smart-Elixir Android APK

            Install on Android: download **Smart-Elixir.apk**, enable **Install unknown apps** for your browser/files app, then open the file.

            | Feature | Works in APK |
            | --- | --- |
            | Ped Dose Calculator | Yes (offline) |
            | CrCl + renal drug lookup | Yes (offline) |
            | AI Summarizer | Needs `VITE_API_BASE_URL` secret pointing to your hosted backend |

            See [ANDROID_APK.md](https://github.com/${{ github.repository }}/blob/main/NEW_SMART_ELIXIR/ANDROID_APK.md) for full setup.
          files: web/android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
          generate_release_notes: true
